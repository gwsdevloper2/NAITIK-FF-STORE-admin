<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAITIK FF STORE - Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Poppins,sans-serif;background:#0f051d;color:#fff;}
h2{text-align:center;margin-top:20px;background:linear-gradient(90deg,#ffcc00,#ff00cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.container{max-width:900px;margin:auto;padding:20px;}
.admin-row{display:flex;flex-wrap:wrap;gap:15px;margin-bottom:10px;}
.admin-row label{flex:1 0 120px;font-weight:600;}
.admin-row input, .admin-row select, .admin-row textarea{flex:2 1 200px;padding:6px;border-radius:5px;border:none;}
.admin-btn{margin-top:10px;padding:10px 18px;border-radius:20px;background:linear-gradient(90deg,#ff00cc,#ffcc00);border:none;font-weight:600;color:#000;cursor:pointer;transition:0.3s;}
.admin-btn:hover{transform:translateY(-2px);}
</style>
</head>
<body>

<h2>NAITIK FF STORE - Admin Panel</h2>
<div class="container">

<div class="admin-row">
<label>Logo URL:</label>
<input type="text" id="adminLogo" placeholder="Enter logo URL">
</div>
<button class="admin-btn" onclick="updateLogo()">Update Logo</button>

<hr>

<h3>Add / Update Product</h3>
<div class="admin-row"><label>Product Name:</label><input type="text" id="adminName"></div>
<div class="admin-row"><label>UID:</label><input type="text" id="adminUID"></div>
<div class="admin-row"><label>Level:</label><input type="text" id="adminLevel"></div>
<div class="admin-row"><label>Price:</label><input type="text" id="adminPrice"></div>
<div class="admin-row"><label>Image URL:</label><input type="text" id="adminImage"></div>
<div class="admin-row"><label>Description:</label><textarea id="adminDesc"></textarea></div>
<div class="admin-row"><label>WhatsApp Link:</label><input type="text" id="adminWhatsApp"></div>
<button class="admin-btn" onclick="addProduct()">Add / Update Product</button>

<hr>

<h3>Social Services</h3>
<div class="admin-row">
<label>Service:</label>
<select id="adminSocial">
<option value="WhatsApp">WhatsApp</option>
<option value="Instagram">Instagram</option>
<option value="Discord">Discord</option>
<option value="Telegram">Telegram</option>
</select>
<input type="text" id="adminSocialLink" placeholder="Enter social link">
</div>
<button class="admin-btn" onclick="updateSocial()">Update Social Service</button>

</div>

<script>
let products = JSON.parse(localStorage.getItem('products')) || [];
let socialServices = JSON.parse(localStorage.getItem('socialServices')) || {};

function saveProducts(){localStorage.setItem('products',JSON.stringify(products));}
function saveSocial(){localStorage.setItem('socialServices',JSON.stringify(socialServices));}

function addProduct(){
let name=document.getElementById("adminName").value;
let uid=document.getElementById("adminUID").value;
let level=document.getElementById("adminLevel").value;
let price=document.getElementById("adminPrice").value;
let image=document.getElementById("adminImage").value;
let desc=document.getElementById("adminDesc").value;
let whatsapp=document.getElementById("adminWhatsApp").value;

if(!name || !uid){alert("Name & UID required"); return;}
products.push({name:name,uid:uid,level:level,price:price,image:image,description:desc,whatsappLink:whatsapp});
saveProducts();
alert("Product Added! Refresh user panel to see changes.");
}

function updateLogo(){
let logo=document.getElementById("adminLogo").value;
if(logo){localStorage.setItem('logo',logo); alert("Logo Updated! Refresh user panel to see changes.");}
}

function updateSocial(){
let type=document.getElementById("adminSocial").value;
let link=document.getElementById("adminSocialLink").value;
if(type && link){socialServices[type]=link; saveSocial(); alert(type+" Link Updated! Refresh user panel to see changes.");}
}
</script>
</body>
</html>
