<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{
background:#0f0524;
font-family:Poppins, sans-serif;
color:white;
padding:20px;
}

h2,h3{text-align:center;}

input,textarea{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:none;
}

button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:8px;
background:#8e2de2;
color:white;
cursor:pointer;
}

.card{
background:#1b083f;
padding:10px;
margin-top:15px;
border-radius:10px;
}

.card img{
width:100%;
height:120px;
object-fit:cover;
border-radius:8px;
}

.delete{
background:red;
margin-top:5px;
}
</style>
</head>

<body>

<h2>Admin Panel</h2>

<input type="text" id="game" placeholder="Game Name">
<input type="text" id="level" placeholder="Level">
<input type="number" id="price" placeholder="Price">

<input type="text" id="whatsapp" placeholder="WhatsApp Number (91XXXXXXXXXX)">
<textarea id="customMessage" placeholder="Custom WhatsApp Message (Optional)"></textarea>

<input type="file" id="image">

<button onclick="addProduct()">Add Product</button>

<h3>All Products</h3>
<div id="adminList"></div>

<script>
let products = JSON.parse(localStorage.getItem("products")) || [];

function addProduct(){
let game=document.getElementById("game").value;
let level=document.getElementById("level").value;
let price=document.getElementById("price").value;
let whatsapp=document.getElementById("whatsapp").value;
let customMessage=document.getElementById("customMessage").value;
let file=document.getElementById("image").files[0];

if(!game||!level||!price||!whatsapp||!file){
alert("Fill All Fields");
return;
}

let reader=new FileReader();
reader.onload=function(){
products.push({
game,
level,
price,
whatsapp,
customMessage,
image:reader.result
});

localStorage.setItem("products",JSON.stringify(products));
alert("Product Added Successfully");
displayAdmin();
}
reader.readAsDataURL(file);
}

function deleteProduct(index){
products.splice(index,1);
localStorage.setItem("products",JSON.stringify(products));
displayAdmin();
}

function displayAdmin(){
let container=document.getElementById("adminList");
container.innerHTML="";

products.forEach((p,index)=>{
container.innerHTML+=`
<div class="card">
<img src="${p.image}">
<b>${p.game}</b> - Lv ${p.level} - ₹${p.price}<br>
WhatsApp: ${p.whatsapp}
<button class="delete" onclick="deleteProduct(${index})">Delete</button>
</div>
`;
});
}

displayAdmin();
</script>

</body>
</html>
