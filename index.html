<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - NAITIK FF STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Poppins;background:#000;color:#fff;padding:20px}
.container{max-width:1000px;margin:auto;background:#111;padding:25px;border-radius:20px}
h2{text-align:center;color:#32CD32}
input,textarea{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:1px solid #32CD32;
background:#0d0d0d;
color:#fff;
}
button{
padding:10px 20px;
border:none;
border-radius:20px;
background:linear-gradient(90deg,#32CD32,#7CFC00);
color:#000;
font-weight:600;
cursor:pointer;
margin-top:10px;
}
button:hover{opacity:.9}
.logout{background:red;color:#fff}
.stats{
display:flex;
gap:20px;
justify-content:space-between;
margin-bottom:20px;
flex-wrap:wrap;
}
.stat-box{
flex:1;
min-width:200px;
background:#0d0d0d;
padding:15px;
border-radius:12px;
text-align:center;
border:1px solid #32CD32;
}
.product-item{
background:#0d0d0d;
padding:10px;
border-radius:10px;
margin-top:10px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}
.action-btn{
padding:5px 12px;
border-radius:12px;
border:none;
cursor:pointer;
font-size:12px;
margin-left:5px;
}
.edit-btn{background:#32CD32;color:#000}
.delete-btn{background:red;color:#fff}
.section-title{margin-top:25px;color:#7CFC00}
</style>
</head>
<body>

<div class="container" id="loginBox">
<h2>Admin Login</h2>
<input type="password" id="loginPass" placeholder="Enter Password">
<button onclick="login()">Login</button>
</div>

<div class="container" id="adminPanel" style="display:none">
<h2>Admin Dashboard</h2>

<div class="stats">
<div class="stat-box">
<div>Total Products</div>
<h3 id="totalProducts">0</h3>
</div>
<div class="stat-box">
<div>Total Value</div>
<h3 id="totalValue">₹0</h3>
</div>
</div>

<input type="hidden" id="editIndex">

<h3 class="section-title">Add / Edit Product</h3>
<input type="text" id="uid" placeholder="UID">
<input type="text" id="level" placeholder="Level">
<input type="number" id="price" placeholder="Price">
<input type="text" id="image" placeholder="Image URL">
<input type="text" id="whatsappLink" placeholder="WhatsApp Buy Link">
<textarea id="description" placeholder="Product Description"></textarea>

<button onclick="saveProduct()">Save Product</button>

<h3 class="section-title">Top WhatsApp Channel Button</h3>
<input type="text" id="whatsappChannelBtn" placeholder="WhatsApp Channel Button Link">
<button onclick="saveChannelBtn()">Save Channel Button</button>

<h3 class="section-title">Social Media Links</h3>
<input type="text" id="whatsappSocial" placeholder="WhatsApp Link">
<input type="text" id="instagramSocial" placeholder="Instagram Link">
<input type="text" id="telegramSocial" placeholder="Telegram Link">
<button onclick="saveSocialLinks()">Save Social Links</button>

<br>
<button onclick="changePassword()" class="action-btn">Change Password</button>
<button onclick="logout()" class="logout action-btn">Logout</button>

<div id="productList"></div>
</div>

<script>

let adminPass = localStorage.getItem('adminPass') || "admin123";
let products = JSON.parse(localStorage.getItem('products')) || [];

function login(){
if(loginPass.value === adminPass){
loginBox.style.display="none";
adminPanel.style.display="block";
sessionStorage.setItem("adminLogin","true");
loadProducts();
loadSocialLinks();
}else{
alert("Wrong Password");
}
}

if(sessionStorage.getItem("adminLogin")==="true"){
loginBox.style.display="none";
adminPanel.style.display="block";
loadProducts();
loadSocialLinks();
}

function logout(){
sessionStorage.removeItem("adminLogin");
location.reload();
}

function saveProduct(){
let product={
uid:uid.value,
level:level.value,
price:price.value,
image:image.value,
whatsappLink:whatsappLink.value,
description:description.value
};

if(!product.uid || !product.price){
alert("UID and Price required");
return;
}

let editIndexValue = editIndex.value;

if(editIndexValue===""){
products.push(product);
}else{
products[editIndexValue] = product;
}

localStorage.setItem("products",JSON.stringify(products));
clearForm();
loadProducts();
}

function loadProducts(){
productList.innerHTML="<h3 class='section-title'>All Products</h3>";
let total=0;

products.forEach((p,i)=>{
total += Number(p.price || 0);
productList.innerHTML+=`
<div class="product-item">
<div>UID: ${p.uid} | ₹${p.price}</div>
<div>
<button class="action-btn edit-btn" onclick="editProduct(${i})">Edit</button>
<button class="action-btn delete-btn" onclick="deleteProduct(${i})">Delete</button>
</div>
</div>
`;
});

totalProducts.innerText = products.length;
totalValue.innerText = "₹"+total;
}

function editProduct(i){
let p=products[i];
uid.value=p.uid;
level.value=p.level;
price.value=p.price;
image.value=p.image;
whatsappLink.value=p.whatsappLink;
description.value=p.description;
editIndex.value=i;
window.scrollTo({top:0,behavior:"smooth"});
}

function deleteProduct(i){
products.splice(i,1);
localStorage.setItem("products",JSON.stringify(products));
loadProducts();
}

function clearForm(){
document.querySelectorAll("#adminPanel input, #adminPanel textarea").forEach(e=>{
if(e.type!=="hidden") e.value="";
});
editIndex.value="";
}

function changePassword(){
let newPass = prompt("Enter New Password");
if(newPass){
localStorage.setItem("adminPass",newPass);
adminPass=newPass;
alert("Password Changed Successfully");
}
}

function saveChannelBtn(){
localStorage.setItem("whatsappChannelBtn",whatsappChannelBtn.value);
alert("Channel Button Saved");
}

function saveSocialLinks(){
let links={
whatsapp:whatsappSocial.value,
instagram:instagramSocial.value,
telegram:telegramSocial.value
};
localStorage.setItem("socialLinks",JSON.stringify(links));
alert("Social Links Saved");
}

function loadSocialLinks(){
let links = JSON.parse(localStorage.getItem("socialLinks")) || {};
if(links.whatsapp) whatsappSocial.value=links.whatsapp;
if(links.instagram) instagramSocial.value=links.instagram;
if(links.telegram) telegramSocial.value=links.telegram;

let channel = localStorage.getItem("whatsappChannelBtn");
if(channel) whatsappChannelBtn.value=channel;
}

</script>

</body>
</html>
