<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - NAITIK FF STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
body{font-family:Poppins;background:#000;color:#fff;padding:20px;}
.container{max-width:1000px;margin:auto;background:#111;padding:25px;border-radius:20px;}
input,textarea{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #32CD32;background:#0d0d0d;color:#fff;}
button{padding:10px 20px;border:none;border-radius:20px;background:linear-gradient(90deg,#32CD32,#7CFC00);color:#000;font-weight:600;cursor:pointer;margin-top:10px;}
.stats{display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;}
.stat-box{flex:1;min-width:200px;background:#0d0d0d;padding:15px;border-radius:12px;text-align:center;border:1px solid #32CD32;}
.product-item{background:#0d0d0d;padding:10px;border-radius:10px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
.action-btn{padding:5px 12px;border-radius:12px;border:none;cursor:pointer;font-size:12px;margin-left:5px;}
.edit-btn{background:#32CD32;color:#000}
.delete-btn{background:red;color:#fff}
</style>
</head>
<body>

<div class="container" id="loginBox">
<h2>Admin Login</h2>
<input type="password" id="loginPass" placeholder="Enter Password">
<button onclick="login()">Login</button>
</div>

<div class="container" id="adminPanel" style="display:none">
<h2>Admin Dashboard</h2>

<h3>Add / Edit Product</h3>
<input type="text" id="uid" placeholder="UID">
<input type="text" id="level" placeholder="Level">
<input type="number" id="price" placeholder="Price">
<input type="text" id="image" placeholder="Image URL">
<input type="text" id="whatsappLink" placeholder="WhatsApp Link">
<textarea id="description" placeholder="Description"></textarea>
<input type="hidden" id="editIndex">
<button onclick="saveProduct()">Save Product</button>

<h3>Social Links</h3>
<input type="text" id="waSocial" placeholder="WhatsApp Link">
<input type="text" id="igSocial" placeholder="Instagram Link">
<input type="text" id="tgSocial" placeholder="Telegram Link">
<button onclick="saveSocialLinks()">Save Social Links</button>

<h3>WhatsApp Channel Button</h3>
<input type="text" id="channelBtn" placeholder="Channel Link">
<button onclick="saveChannel()">Save Channel</button>

<h3>All Products</h3>
<div id="productList"></div>
</div>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyAuA5NuO-DDWTlQtjUChZR52K5co_mYHQI",
  authDomain: "naitik-ff-store-539c8.firebaseapp.com",
  projectId: "naitik-ff-store-539c8",
  storageBucket: "naitik-ff-store-539c8.appspot.com",
  messagingSenderId: "169337528367",
  appId: "1:169337528367:web:6988e142a352640535e6da"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Admin login
let adminPass = localStorage.getItem("adminPass")||"admin123";
function login(){
  if(loginPass.value===adminPass){
    loginBox.style.display="none";
    adminPanel.style.display="block";
    loadProducts();
    loadSettings();
  }else{alert("Wrong password")}
}

// Save product
function saveProduct(){
  let data={uid:uid.value,level:level.value,price:price.value,image:image.value,whatsappLink:whatsappLink.value,description:description.value};
  let edit = editIndex.value;
  if(edit===""){
    db.collection("products").add(data).then(()=>{clearForm();});
  }else{
    db.collection("products").doc(edit).set(data).then(()=>{clearForm();});
  }
}

// Load products
function loadProducts(){
  db.collection("products").onSnapshot(snapshot=>{
    productList.innerHTML="";
    snapshot.forEach(doc=>{
      let p=doc.data();
      productList.innerHTML+=`<div class="product-item">UID:${p.uid} | ₹${p.price}
      <div>
      <button class="action-btn edit-btn" onclick="editProduct('${doc.id}')">Edit</button>
      <button class="action-btn delete-btn" onclick="deleteProduct('${doc.id}')">Delete</button>
      </div></div>`;
    });
  });
}

function editProduct(id){
  db.collection("products").doc(id).get().then(doc=>{
    let p=doc.data();
    uid.value=p.uid; level.value=p.level; price.value=p.price; image.value=p.image; whatsappLink.value=p.whatsappLink; description.value=p.description;
    editIndex.value=id;
  });
}
function deleteProduct(id){db.collection("products").doc(id).delete();}

// Social Links
function saveSocialLinks(){
  db.collection("settings").doc("social").set({whatsapp:waSocial.value,instagram:igSocial.value,telegram:tgSocial.value});
}
function saveChannel(){db.collection("settings").doc("channel").set({link:channelBtn.value});}
function loadSettings(){
  db.collection("settings").doc("social").get().then(doc=>{if(doc.exists){waSocial.value=doc.data().whatsapp||""; igSocial.value=doc.data().instagram||""; tgSocial.value=doc.data().telegram||"";}});
  db.collection("settings").doc("channel").get().then(doc=>{if(doc.exists){channelBtn.value=doc.data().link||"";}});
}

// Clear form
function clearForm(){[uid,level,price,image,whatsappLink,description,editIndex].forEach(e=>e.value="");}
</script>

</body>
</html>
